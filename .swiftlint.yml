# SwiftLint Architecture & Boundary Configuration for Universal Agents Workflow

disabled_rules:
  - trailing_whitespace
  - identifier_name
  - cyclomatic_complexity
  - large_tuple
  - redundant_string_enum_value
  - todo
  - function_parameter_count
  - inclusive_language
  - line_length
  - file_length
  - function_body_length
  - type_body_length
  - trailing_newline

opt_in_rules:
  - force_unwrapping
  - force_try
  - force_cast
  - fatal_error_message
  - weak_delegate
  - closure_spacing
  - multiline_parameters
  - redundant_nil_coalescing

force_unwrapping:
  severity: error

force_try:
  severity: error

force_cast:
  severity: error

excluded:
  - .build
  - build
  - DerivedData
  - Pods
  - FlowSnapLab
  - scripts
  - .specify
