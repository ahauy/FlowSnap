# SwiftLint Architecture & Boundary Configuration for Universal Agents Workflow

disabled_rules:
  - trailing_whitespace

opt_in_rules:
  - force_unwrapping
  - force_try
  - force_cast
  - fatal_error_message
  - weak_delegate
  - closure_spacing
  - multiline_parameters
  - redundant_nil_coalescing

force_unwrapping:
  severity: error

force_try:
  severity: error

force_cast:
  severity: error

line_length:
  warning: 140
  error: 200

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 40
  error: 70

type_body_length:
  warning: 300
  error: 500

excluded:
  - .build
  - DerivedData
  - Pods
  - Tests
